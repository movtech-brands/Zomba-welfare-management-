
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2E7382">
<title>Zomba Welfare Management</title>

<style>
:root {
  --primary: #2E7382;
  --dark: #205866;
  --background: #F4F6F7;
  --white: #FFFFFF;
  --text: #333333;
  --muted: #77858A;
  --border: #E1E8EA;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: var(--background);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

button, input {
  font: inherit;
}

.login-container {
  width: 100%;
  max-width: 410px;
}

.brand {
  text-align: center;
  margin-bottom: 28px;
}

.brand h1 {
  color: var(--primary);
  font-size: 27px;
  margin: 0;
  font-weight: 800;
  letter-spacing: -0.7px;
}

.brand p {
  color: var(--muted);
  font-size: 13px;
  margin: 7px 0 0;
}

.login-card {
  background: var(--white);
  padding: 28px 24px;
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 8px 30px rgba(0,0,0,0.05);
}

.login-card h2 {
  font-size: 20px;
  margin: 0 0 20px;
  text-align: center;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin: 15px 0 6px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #CBD7DA;
  border-radius: 9px;
  outline: none;
  background: white;
}

input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(46,115,130,0.1);
}

.primary-btn {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 9px;
  background: var(--primary);
  color: white;
  font-weight: 700;
  margin-top: 22px;
  cursor: pointer;
}

.primary-btn:hover {
  background: var(--dark);
}

.primary-btn:disabled {
  opacity: 0.6;
  cursor: wait;
}

.signup-link {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  margin: 20px 0 0;
}

.signup-link a {
  color: var(--primary);
  font-weight: 700;
  text-decoration: none;
}

.message {
  margin-top: 15px;
  padding: 11px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
  overflow-wrap: anywhere;
}

.message.error {
  display: block;
  background: #FFF0EF;
  color: #A23B36;
}

.message.success {
  display: block;
  background: #EAF5EF;
  color: #176B45;
}

/* Registration form */
.signup-form {
  display: none;
}

.back-link {
  display: block;
  text-align: center;
  margin-top: 18px;
  font-size: 13px;
  color: var(--primary);
  text-decoration: none;
  cursor: pointer;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  margin-top: 25px;
}

.hidden {
  display: none !important;
}

@media(max-width:420px) {
  .brand h1 {
    font-size: 23px;
  }

  .login-card {
    padding: 24px 19px;
  }
}
</style>
</head>

<body>

<div class="login-container">

  <div class="brand">
    <h1>Zomba Welfare Management</h1>
    <p>Together, we care.</p>
  </div>

  <div class="login-card">

    <!-- LOGIN FORM -->
    <div id="loginSection">
      <h2>Log in to your account</h2>

      <form id="loginForm">

        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button type="submit" class="primary-btn" id="loginButton">
          Log in
        </button>

      </form>

      <div id="loginMessage" class="message"></div>

      <p class="signup-link">
        Don't have an account?
        <a href="#" id="showSignup">Sign up</a>
      </p>
    </div>

    <!-- SIGN UP FORM -->
    <div id="signupSection" class="signup-form">

      <h2>Create your account</h2>

      <form id="signupForm">

        <label for="fullName">Full name</label>
        <input id="fullName" required placeholder="Your full name">

        <label for="phone">Phone number</label>
        <input id="phone" type="tel" placeholder="Your phone number">

        <label for="signupEmail">Personal email</label>
        <input id="signupEmail" type="email" required placeholder="Your email">

        <label for="signupPassword">Password</label>
        <input id="signupPassword" type="password" minlength="8" required placeholder="At least 8 characters">

        <button type="submit" class="primary-btn" id="signupButton">
          Create account
        </button>

      </form>

      <div id="signupMessage" class="message"></div>

      <a class="back-link" id="showLogin" href="#">
        Back to log in
      </a>

    </div>

  </div>

  <footer>
    Zomba Welfare Management
  </footer>

</div>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
"https://emmdhxlcqbvpvpjsmshz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Lu_e6XN9ZeXfQCPP5VkXqQ_jY6ceXzm";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

function showMessage(element, text, type) {
  element.textContent = text;
  element.className = "message " + type;
}

function showLoginForm() {
  $("loginSection").style.display = "block";
  $("signupSection").style.display = "none";
  $("loginMessage").className = "message";
  $("signupMessage").className = "message";
}

function showSignupForm() {
  $("loginSection").style.display = "none";
  $("signupSection").style.display = "block";
  $("loginMessage").className = "message";
  $("signupMessage").className = "message";
}

$("showSignup").addEventListener("click", e => {
  e.preventDefault();
  showSignupForm();
});

$("showLogin").addEventListener("click", e => {
  e.preventDefault();
  showLoginForm();
});

/* ROLE-BASED REDIRECTION */

async function redirectByRole() {

  const {
    data: { user },
    error: userError
  } = await supabase.auth.getUser();

  if (userError || !user) {
    showLoginForm();
    return;
  }

  const { data, error } = await supabase
    .from("user_roles")
    .select("role")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error || !data) {
    await supabase.auth.signOut();

    showMessage(
      $("loginMessage"),
      "Unable to verify your account role. Please contact the administrator.",
      "error"
    );

    return;
  }

  const role = data.role;

  if (role === "administrator") {
    window.location.replace("admin.html");
  }

  else if (role === "member") {
    window.location.replace("member.html");
  }

  else if (role === "treasurer") {
    window.location.replace("treasurer.html");
  }

  else if (role === "chairperson") {
    window.location.replace("chairperson.html");
  }

  else {
    await supabase.auth.signOut();

    showMessage(
      $("loginMessage"),
      "Your account role is not recognised. Please contact the administrator.",
      "error"
    );
  }
}

/* LOGIN */

$("loginForm").addEventListener("submit", async e => {

  e.preventDefault();

  const button = $("loginButton");
  button.disabled = true;
  button.textContent = "Signing in...";

  const { error } = await supabase.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });

  button.disabled = false;
  button.textContent = "Log in";

  if (error) {
    showMessage($("loginMessage"), error.message, "error");
    return;
  }

  await redirectByRole();

});

/* REGISTRATION */

$("signupForm").addEventListener("submit", async e => {

  e.preventDefault();

  const button = $("signupButton");
  button.disabled = true;
  button.textContent = "Creating account...";

  const { data, error } = await supabase.auth.signUp({

    email: $("signupEmail").value.trim(),

    password: $("signupPassword").value,

    options: {
      data: {
        full_name: $("fullName").value.trim(),
        phone_number: $("phone").value.trim()
      }
    }

  });

  button.disabled = false;
  button.textContent = "Create account";

  if (error) {
    showMessage($("signupMessage"), error.message, "error");
    return;
  }

  if (data.session) {
    await redirectByRole();
  } else {
    showMessage(
      $("signupMessage"),
      "Account created. Please check your email for the verification link, then log in.",
      "success"
    );
  }

});

/* CHECK EXISTING SESSION */

await redirectByRole();

</script>

</body>
</html>
