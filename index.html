
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zomba Welfare Management</title>

  <style>
    :root {
      --primary: #2E7382;
      --white: #FFFFFF;
      --background: #F4F4F4;
      --text: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--background);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 410px;
      background: var(--white);
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.07);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      color: var(--primary);
      font-size: 25px;
      margin-bottom: 7px;
    }

    .brand p {
      color: #777;
      font-size: 13px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 22px;
      text-align: center;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }

    .switch a {
      color: var(--primary);
      font-weight: bold;
      text-decoration: none;
    }

    .message {
      margin-top: 15px;
      padding: 11px;
      border-radius: 7px;
      font-size: 13px;
      display: none;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error {
      background: #fdeaea;
      color: #a32626;
    }

    .success {
      background: #e7f5eb;
      color: #216b38;
    }

    .hidden {
      display: none !important;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #999;
      font-size: 11px;
    }
  </style>

  <!-- Supabase browser library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>

<body>

  <div class="container">

    <div class="brand">
      <h1>Zomba Welfare Management</h1>
      <p>Together, we care.</p>
    </div>

    <!-- LOGIN -->
    <div id="loginSection">
      <h2>Member Login</h2>

      <form id="loginForm">

        <div class="field">
          <label for="loginEmail">Email Address</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" id="loginButton">Login</button>

      </form>

      <div class="switch">
        Don't have an account?
        <a href="#" id="showSignup">Create account</a>
      </div>
    </div>

    <!-- SIGNUP -->
    <div id="signupSection" class="hidden">
      <h2>Create Account</h2>

      <form id="signupForm">

        <div class="field">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="field">
          <label for="phoneNumber">Phone Number</label>
          <input
            type="tel"
            id="phoneNumber"
            placeholder="Enter your phone number"
            autocomplete="tel"
            required
          >
        </div>

        <div class="field">
          <label for="signupEmail">Personal Email Address</label>
          <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="signupPassword">Password</label>
          <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit" id="signupButton">
          Create Account
        </button>

      </form>

      <div class="switch">
        Already have an account?
        <a href="#" id="showLogin">Login</a>
      </div>
    </div>

    <div id="message" class="message" role="status"></div>

    <div class="footer">
      Zomba Welfare Management System
    </div>

  </div>

<script>
(() => {
  "use strict";

  const SUPABASE_URL =
    "https://emmdhxlcqbvpvpjsmshz.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Lu_e6XN9ZeXfQCPP5VkXqQ_jY6ceXzm";

  let supabaseClient = null;

  const $ = id => document.getElementById(id);

  const loginSection = $("loginSection");
  const signupSection = $("signupSection");
  const messageBox = $("message");

  function showMessage(message, type = "error") {
    messageBox.textContent = message;
    messageBox.className = "message " + type;
    messageBox.style.display = "block";
  }

  function clearMessage() {
    messageBox.textContent = "";
    messageBox.style.display = "none";
  }

  function setButton(button, disabled, text) {
    button.disabled = disabled;
    button.textContent = text;
  }

  function switchForm(showSignup) {
    clearMessage();

    loginSection.classList.toggle("hidden", showSignup);
    signupSection.classList.toggle("hidden", !showSignup);
  }

  $("showSignup").addEventListener("click", event => {
    event.preventDefault();
    switchForm(true);
  });

  $("showLogin").addEventListener("click", event => {
    event.preventDefault();
    switchForm(false);
  });

  // Create the Supabase client.
  function initialiseSupabase() {
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      throw new Error(
        "The login service could not load. Please refresh the page or try again later."
      );
    }

    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  }

  // Redirect according to the user's database role.
  async function redirectUser(user) {
    const { data, error } = await supabaseClient
      .from("user_roles")
      .select("role")
      .eq("user_id", user.id)
      .maybeSingle();

    if (error) {
      console.error("Role lookup error:", error);
      throw new Error(
        "We could not verify your account role. Please try again."
      );
    }

    if (!data) {
      await supabaseClient.auth.signOut();

      throw new Error(
        "No system role is assigned to your account. Please contact the administrator."
      );
    }

    if (data.role === "administrator") {
      window.location.replace("admin.html");
      return;
    }

    if (data.role === "member") {
      window.location.replace("member.html");
      return;
    }

    await supabaseClient.auth.signOut();

    throw new Error(
      "Your account has an invalid role. Please contact the administrator."
    );
  }

  // LOGIN
  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    clearMessage();

    const button = $("loginButton");

    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value;

    if (!supabaseClient) {
      showMessage("Login service is not ready. Please refresh the page.");
      return;
    }

    setButton(button, true, "Signing in...");

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      if (!data.user) {
        throw new Error("Login was unsuccessful. Please try again.");
      }

      await redirectUser(data.user);

    } catch (error) {
      console.error("Login error:", error);

      showMessage(
        error.message || "Login failed. Please check your details."
      );

      setButton(button, false, "Login");
    }
  });

  // REGISTRATION
  $("signupForm").addEventListener("submit", async event => {
    event.preventDefault();
    clearMessage();

    const button = $("signupButton");

    const fullName = $("fullName").value.trim();
    const phoneNumber = $("phoneNumber").value.trim();
    const email = $("signupEmail").value.trim();
    const password = $("signupPassword").value;

    if (!supabaseClient) {
      showMessage("Registration service is not ready. Please refresh.");
      return;
    }

    setButton(button, true, "Creating account...");

    try {
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName,
            phone_number: phoneNumber
          }
        }
      });

      if (error) throw error;

      if (data.session && data.user) {
        showMessage(
          "Your account has been created successfully.",
          "success"
        );

        await redirectUser(data.user);

      } else {
        $("signupForm").reset();

        showMessage(
          "Your account has been created. Please check your email and click the verification link before logging in.",
          "success"
        );
      }

    } catch (error) {
      console.error("Registration error:", error);

      showMessage(
        error.message || "Registration failed. Please try again."
      );

    } finally {
      setButton(button, false, "Create Account");
    }
  });

  // Check whether a user is already signed in.
  async function checkExistingSession() {
    try {
      const { data, error } = await supabaseClient.auth.getSession();

      if (error) throw error;

      if (data.session && data.session.user) {
        await redirectUser(data.session.user);
      }

    } catch (error) {
      console.error("Session check:", error);

      if (error.message) {
        showMessage(error.message);
      }
    }
  }

  // Start the application.
  try {
    initialiseSupabase();
    checkExistingSession();

  } catch (error) {
    console.error("Application initialisation error:", error);
    showMessage(error.message);
  }

})();
</script>

</body>
</html>
