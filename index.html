
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zomba Welfare Management</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #2E7382;
      --white: #FFFFFF;
      --background: #F4F4F4;
      --text: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--background);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 410px;
      background: var(--white);
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.07);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      color: var(--primary);
      font-size: 25px;
      margin-bottom: 7px;
    }

    .brand p {
      color: #777;
      font-size: 13px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 22px;
      text-align: center;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }

    .switch a {
      color: var(--primary);
      font-weight: bold;
      text-decoration: none;
    }

    .message {
      margin-top: 15px;
      padding: 11px;
      border-radius: 7px;
      font-size: 13px;
      display: none;
      line-height: 1.5;
    }

    .error {
      background: #fdeaea;
      color: #a32626;
    }

    .success {
      background: #e7f5eb;
      color: #216b38;
    }

    .hidden {
      display: none;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #999;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      <h1>Zomba Welfare Management</h1>
      <p>Together, we care.</p>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginSection">
      <h2>Member Login</h2>

      <form id="loginForm">

        <div class="field">
          <label>Email Address</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="field">
          <label>Password</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            required
          >
        </div>

        <button type="submit" id="loginButton">
          Login
        </button>

      </form>

      <div class="switch">
        Don't have an account?
        <a href="#" id="showSignup">Create account</a>
      </div>
    </div>


    <!-- SIGNUP FORM -->
    <div id="signupSection" class="hidden">
      <h2>Create Account</h2>

      <form id="signupForm">

        <div class="field">
          <label>Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
          >
        </div>

        <div class="field">
          <label>Phone Number</label>
          <input
            type="tel"
            id="phoneNumber"
            placeholder="Enter your phone number"
            required
          >
        </div>

        <div class="field">
          <label>Personal Email Address</label>
          <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="field">
          <label>Password</label>
          <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            minlength="8"
            required
          >
        </div>

        <button type="submit" id="signupButton">
          Create Account
        </button>

      </form>

      <div class="switch">
        Already have an account?
        <a href="#" id="showLogin">Login</a>
      </div>
    </div>

    <div id="message" class="message"></div>

    <div class="footer">
      Zomba Welfare Management System
    </div>

  </div>


<script>
  // SUPABASE CONFIGURATION
  const SUPABASE_URL = "https://emmdhxlcqbvpvpjsmshz.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_Lu_e6XN9ZeXfQCPP5VkXqQ_jY6ceXzm";

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  // ELEMENTS
  const loginSection = document.getElementById("loginSection");
  const signupSection = document.getElementById("signupSection");
  const messageBox = document.getElementById("message");


  // DISPLAY MESSAGE
  function showMessage(message, type = "error") {
    messageBox.textContent = message;
    messageBox.className = "message " + type;
    messageBox.style.display = "block";
  }

  function clearMessage() {
    messageBox.style.display = "none";
    messageBox.textContent = "";
  }


  // SWITCH BETWEEN LOGIN AND SIGNUP
  document.getElementById("showSignup").addEventListener("click", function(e) {
    e.preventDefault();
    clearMessage();
    loginSection.classList.add("hidden");
    signupSection.classList.remove("hidden");
  });

  document.getElementById("showLogin").addEventListener("click", function(e) {
    e.preventDefault();
    clearMessage();
    signupSection.classList.add("hidden");
    loginSection.classList.remove("hidden");
  });


  // ROLE-BASED REDIRECTION
  async function redirectUser(user) {

    const { data, error } = await supabase
      .from("user_roles")
      .select("role")
      .eq("user_id", user.id)
      .maybeSingle();

    if (error) {
      console.error("Role lookup error:", error);
      throw new Error("Unable to check your account role. Please try again.");
    }

    if (!data) {
      await supabase.auth.signOut();
      throw new Error("No system role is assigned to your account. Contact the administrator.");
    }

    if (data.role === "administrator") {
      window.location.replace("admin.html");
      return;
    }

    if (data.role === "member") {
      window.location.replace("member.html");
      return;
    }

    await supabase.auth.signOut();

    throw new Error("Your account has an invalid role. Contact the administrator.");
  }


  // LOGIN
  document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    clearMessage();

    const button = document.getElementById("loginButton");
    button.disabled = true;
    button.textContent = "Signing in...";

    try {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      await redirectUser(data.user);

    } catch (error) {
      showMessage(error.message || "Login failed. Please try again.");
      button.disabled = false;
      button.textContent = "Login";
    }
  });


  // SIGN UP
  document.getElementById("signupForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    clearMessage();

    const button = document.getElementById("signupButton");
    button.disabled = true;
    button.textContent = "Creating account...";

    try {
      const fullName = document.getElementById("fullName").value.trim();
      const phoneNumber = document.getElementById("phoneNumber").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value;

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName,
            phone_number: phoneNumber
          }
        }
      });

      if (error) throw error;

      if (data.session && data.user) {
        showMessage(
          "Your account has been created. You can now access the system.",
          "success"
        );

        await redirectUser(data.user);
      } else {
        showMessage(
          "Your account has been created. Please check your email and click the verification link before logging in.",
          "success"
        );

        document.getElementById("signupForm").reset();
      }

    } catch (error) {
      showMessage(error.message || "Registration failed. Please try again.");
    } finally {
      button.disabled = false;
      button.textContent = "Create Account";
    }
  });


  // CHECK EXISTING SESSION
  async function checkExistingSession() {
    try {
      const { data, error } = await supabase.auth.getSession();

      if (error) throw error;

      if (data.session && data.session.user) {
        await redirectUser(data.session.user);
      }

    } catch (error) {
      console.error("Session check:", error);
    }
  }

  checkExistingSession();

</script>

</body>
</html>
